global:
  external_labels:
    prometheus: demo
scrape_configs:
  # Stores prometheus_http_request_duration_seconds as a classic histogram.
  - job_name: 'self'
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets: ['localhost:1236']
  # Stores the same histogram as a native histogram with custom buckets (NHCB).
  - job_name: 'self-nh'
    scrape_interval: 5s
    scrape_timeout: 5s
    convert_classic_histograms_to_nhcb: true
    static_configs:
      - targets: ['localhost:1236']
